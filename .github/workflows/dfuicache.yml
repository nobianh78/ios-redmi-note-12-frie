name: dfuicache

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dfuicache/**'
      - '.github/workflows/dfuicache.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS binary
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -fobjc-arc -O2 -framework Foundation -framework UIKit -framework MobileCoreServices \
            -o dfuicache tools/dfuicache/dfuicache.m
          codesign -f -s - --entitlements tools/dfuicache/entitlements.plist dfuicache
          file dfuicache
          codesign -d --entitlements - dfuicache | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: dfuicache
          path: dfuicache
