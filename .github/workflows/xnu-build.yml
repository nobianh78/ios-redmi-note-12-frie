# Build Apple's open-source XNU kernel (APSL, apple-oss-distributions/xnu) on a GitHub-hosted
# macOS runner, which runs on real Apple hardware, as the Xcode toolchain requires.
# Uses blacktop/darwin-xnu-build. Target: plain arm64 (no PAC) for the MT6768's Cortex-A75/A55.
#
# History:
#  - xnu 26.5 arm64e built fine but hangs on the phone: ARMv8.2 cores have no retab/braa (PAC).
#  - xnu 26.5 with the arch forced to arm64 compiles but fails to link (vm_first_phys/vm_last_phys
#    missing from lowmem_vectors.o): that tree only links as arm64e.
#    Root cause (makedefs/MakeInc.def:1175-1185): VMAPPLE enables SPTM, which links the closed,
#    arm64e-only libsptm_xnu / libTrustedExecutionMonitor_Kernel from the KDK. Modern xnu cannot
#    be built as plain arm64 for non-Apple silicon.
#  - Now: xnu-8796 (macOS 13.5), the pre-SPTM iOS 16-era tree that other ports have built as plain
#    arm64, with Xcode 15 (Xcode 16's iig emits IORPC.kernelContent, which xnu-8796 lacks).
name: xnu-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xnu-build.yml', 'xnu/**', 'userland/**', 'tools/macho_static.js']

env:
  MACOS_VERSION: '13.5'          # xnu-8796; unset makes build.sh prompt (gum choose)
  MCPU: cortex-a55

jobs:
  build:
    runs-on: macos-15            # macos-14 runners were retired; check whether this image still ships Xcode 15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build
        run: git clone --depth 1 https://github.com/blacktop/darwin-xnu-build.git build-xnu

      # Force plain arm64 for the kernel (upstream only exposes this override for --lib) and build
      # libfirehose_kernel for arm64 with the same CPU target so it links into that kernel.
      - name: Patch build.sh for plain arm64 (no PAC)
        working-directory: build-xnu
        run: |
          perl -0pi -e 's/(make install -j8 VERBOSE=YES "\$\{CTF_TOOL_OVERRIDES\[\@\]\}") SDKROOT=macosx/$1 ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 CFLAGS_EXTRA="-mcpu=$ENV{MCPU}" SDKROOT=macosx/' build.sh
          perl -pi -e 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=$ENV{MCPU}"/' build.sh
          grep -n "ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 \|OTHER_CFLAGS=\"-mkernel" build.sh
          test "$(grep -c 'ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 CFLAGS_EXTRA' build.sh)" -ge 1
          test "$(grep -c "mcpu=$MCPU\" " build.sh)" -ge 1
          # Patch the xnu tree for Xcode 16 right after build.sh clones it.
          perl -pi -e 's|^(\s*git clone --branch "\$\{XNU_VERSION\}" https://github.com/apple-oss-distributions/xnu.git "\$\{WORK_DIR\}/xnu")\s*$|$1\n        bash "$ENV{GITHUB_WORKSPACE}/xnu/fix-xcode16.sh" "\${WORK_DIR}/xnu"\n|' build.sh
          grep -n 'fix-xcode16.sh' build.sh

      # Incremental builds: restore the xnu tree, the object dirs and the fakeroot (mig/ctf tools,
      # installed headers) from the last run. build.sh then skips the clone and the tool builds,
      # and make only rebuilds what fix-xcode16.sh touched. A workflow edit starts a fresh cache.
      # The KDK (~70 s to download and install each run) is cached too; build.sh skips it when the
      # directory exists. The cache action extracts as the runner user, so own the parent dir first.
      - name: Make the KDK dir writable
        run: sudo mkdir -p /Library/Developer/KDKs && sudo chown "$(id -u)" /Library/Developer/KDKs

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-xnu/xnu
            build-xnu/build
            build-xnu/fakeroot
            /Library/Developer/KDKs/KDK_13.5_22G74.kdk
          key: xnu8796-${{ hashFiles('.github/workflows/xnu-build.yml') }}-${{ github.sha }}
          restore-keys: xnu8796-${{ hashFiles('.github/workflows/xnu-build.yml') }}-

      # build.sh only runs fix-xcode16.sh right after cloning, and skips the whole kernel build if the
      # last kernel image exists. With a cached tree: reset it to pristine (only patched files get new
      # mtimes), re-apply our patches (build.sh's own patches() still runs after), drop the old kernels.
      - name: Prepare cached tree
        if: steps.cache.outputs.cache-matched-key != ''
        run: |
          git -C build-xnu/xnu checkout -q -- .
          git -C build-xnu/xnu clean -fdq
          bash xnu/fix-xcode16.sh build-xnu/xnu
          rm -f build-xnu/build/xnu.obj/kernel.*
          rm -rf build-xnu/fakeroot/System/Library/Kernels
          echo "::notice::incremental build from cache ${{ steps.cache.outputs.cache-matched-key }}"

      - name: Deps (oldest Xcode available)
        run: |
          brew tap blacktop/tap
          brew trust blacktop/tap || true
          brew install bash jq gum cmake ninja blacktop/tap/ipsw
          # build.sh only checks that xcodes exists; Xcode is preinstalled on the runner
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          ls -d /Applications/Xcode*.app
          echo "::error::available Xcodes: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          # No Xcode 15 on any current runner image; use the oldest Xcode 16 and see what breaks.
          XC=$(ls -d /Applications/Xcode_15*.app /Applications/Xcode_16.0.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || { echo "::error::no Xcode 15/16.0 on this image"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build XNU (ARM64 / VMAPPLE)
        working-directory: build-xnu
        env:
          MACHINE_CONFIG: VMAPPLE
        # On failure, surface the errors as annotations (readable via the public API without login).
        # GitHub keeps only 10 per step, so undefined symbols are folded into one line.
        # build.sh can exit 0 without producing a kernel (some steps end in `|| true`), so judge by output.
        run: |
          set -o pipefail
          report() {
            set +e   # the runner uses bash -e; a grep with no match must not abort the report
            # C and demangled C++ names ("Class::method(...)", "vtable for Class")
            syms=$(grep -oE '^\s*"[^"]+", referenced' build.log | cut -d'"' -f2 | sort -u | tr '\n' ';' | cut -c1-3500)
            [ -n "$syms" ] && echo "::error::undefined symbols: $syms"
            # compiler/assembler errors with a file location; skip build.sh's harmless patch-apply noise
            sed -e 's/\x1b\[[0-9;]*m//g' build.log \
              | grep -E '\.(c|cpp|h|s|S|hpp|iig|defs):[0-9]+(:[0-9]+)?: (fatal )?error:' \
              | awk '!seen[$0]++' | head -n 6 | sed 's/^/::error::/'
            # linker diagnostics other than undefined symbols (duplicates, bad relocations, ...)
            # the lines just before the first failing make target hold the real ld/compiler message
            clean=$(mktemp); sed -e 's/\x1b\[[0-9;]*m//g' build.log > "$clean"
            n=$(grep -n -m1 -E 'make\[[0-9]+\]: \*\*\* ' "$clean" | cut -d: -f1)
            if [ -n "$n" ]; then
              echo "::error::before failure: $(head -n "$n" "$clean" | tail -n 40 | grep -viE 'warning|patch|^\s*$' | tail -n 15 | tr '\n' '|' | cut -c1-3000)"
            fi
            echo "::error::first make failure: $(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -m1 -E 'make\[[0-9]+\]: \*\*\* ' | cut -c1-600)"
            echo "::error::log tail: $(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -v '^\s*$' | tail -n 8 | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
          bash build.sh 2>&1 | tee build.log || report
          ls fakeroot/System/Library/Kernels/kernel* >/dev/null 2>&1 || report
          ls -lah fakeroot/System/Library/Kernels/
          file fakeroot/System/Library/Kernels/kernel*   # expect arm64, not arm64e

      - name: Save build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            build-xnu/xnu
            build-xnu/build
            build-xnu/fakeroot
            /Library/Developer/KDKs/KDK_13.5_22G74.kdk
          key: xnu8796-${{ hashFiles('.github/workflows/xnu-build.yml') }}-${{ github.sha }}

      # P2 root filesystem: a raw HFS+ volume (no partition map, not journaled) holding PID 1
      # (fire_init/fire_sh as /sbin/launchd) and the directories the kernel expects (/dev for devfs).
      # The loader packs it as the md0 RAMDisk.
      - name: Build fire_init and the HFS+ root image
        run: |
          set -e
          mkdir -p out/init
          clang -target arm64-apple-macos11 -O2 -ffreestanding -fno-stack-protector -fno-builtin -mcpu=cortex-a55 \
            -c userland/fire_init/fire_init.c -o out/init/fire_init.o
          # ld64 links a static image (LC_UNIXTHREAD) directly; otherwise convert an LC_MAIN image the
          # way the Windows build does (tools/macho_static.js).
          if ld -arch arm64 -platform_version macos 11.0 11.0 -static -e _start -o out/init/fire_init.static out/init/fire_init.o; then
            otool -l out/init/fire_init.static | grep -q LC_UNIXTHREAD
          else
            ld -arch arm64 -platform_version macos 11.0 11.0 -e _start -undefined dynamic_lookup -o out/init/fire_init out/init/fire_init.o
            node tools/macho_static.js out/init/fire_init out/init/fire_init.static
          fi
          otool -l out/init/fire_init.static | grep -E 'cmd LC_|segname' | sort | uniq -c
          hdiutil create -size 16m -fs HFS+ -volname fire -layout NONE -type UDIF -o out/fire_root.dmg
          hdiutil attach out/fire_root.dmg -mountpoint /tmp/fireroot -nobrowse -owners on
          sudo mkdir -p /tmp/fireroot/sbin /tmp/fireroot/bin /tmp/fireroot/dev /tmp/fireroot/etc /tmp/fireroot/tmp
          sudo cp out/init/fire_init.static /tmp/fireroot/sbin/launchd
          echo "DarwinFire: HFS+ root on open-source XNU, Redmi 12 fire / MT6768" | sudo tee /tmp/fireroot/etc/motd >/dev/null
          sudo chmod 755 /tmp/fireroot/sbin/launchd
          sudo chmod 1777 /tmp/fireroot/tmp
          sudo chown -R 0:0 /tmp/fireroot
          ls -laR /tmp/fireroot | head -40
          hdiutil detach /tmp/fireroot
          hdiutil convert out/fire_root.dmg -format UDTO -o out/fire_root
          mv out/fire_root.cdr out/fire_root.img
          ls -la out/fire_root.img
          xxd -s 1024 -l 16 out/fire_root.img     # expect "H+" at the volume header

      - name: Upload root image
        uses: actions/upload-artifact@v4
        with:
          name: fire-root-hfs
          path: out/fire_root.img
          if-no-files-found: error

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-arm64-vmapple
          path: build-xnu/fakeroot/System/Library/Kernels/
          if-no-files-found: error
