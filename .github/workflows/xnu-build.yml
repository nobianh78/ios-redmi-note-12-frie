# Build Apple's open-source XNU kernel (APSL, apple-oss-distributions/xnu) on a GitHub-hosted
# macOS runner, which runs on real Apple hardware, as the Xcode toolchain requires.
# Mirrors the upstream CI of blacktop/darwin-xnu-build (.github/workflows/c-cpp.yml).
# First milestone: an unmodified ARM64 VMAPPLE build, the least hardware-specific XNU platform
# and the base for a future MT6768 ("fire") platform layer.
name: xnu-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/xnu-build.yml', 'xnu/**']

env:
  MACOS_VERSION: '26.5'          # selects the xnu tag + KDK; unset makes build.sh prompt (gum choose)
  XCODE_APP: /Applications/Xcode_26.1.app

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build
        run: git clone --depth 1 https://github.com/blacktop/darwin-xnu-build.git build-xnu

      # MT6768's Cortex-A75/A55 (ARMv8.2) have no pointer authentication: an arm64e kernel dies on its
      # first retab/braa (measured: ~29k such instructions in the default build). Build plain arm64 for
      # Cortex-A55 instead. upstream build.sh only exposes this override for --lib, so add it to the
      # kernel `make install` and build libfirehose_kernel for arm64 as well.
      - name: Patch build.sh for plain arm64 (no PAC)
        working-directory: build-xnu
        run: |
          perl -0pi -e 's/(make install -j8 VERBOSE=YES "\$\{CTF_TOOL_OVERRIDES\[\@\]\}") SDKROOT=macosx/$1 ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 CFLAGS_EXTRA="-mcpu=cortex-a55" SDKROOT=macosx/' build.sh
          perl -pi -e 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64 arm64e" VALID_ARCHS="x86_64 arm64 arm64e"/' build.sh
          grep -n 'ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 \|ARCHS="x86_64 arm64 arm64e"' build.sh
          test "$(grep -c 'ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 CFLAGS_EXTRA' build.sh)" -ge 1

      - name: Deps
        run: |
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install bash blacktop/tap/ipsw
          brew uninstall cmake || true
          brew install cmake
          sudo xcode-select -s "$XCODE_APP"

      - name: Build XNU (ARM64 / VMAPPLE)
        working-directory: build-xnu
        env:
          MACHINE_CONFIG: VMAPPLE
          KC_FILTER: 'com.apple.driver.SEPHibernation|com.apple.iokit.IOACPIFamily'
        # On failure, surface the log tail as annotations (GitHub shows at most 10 per step,
        # readable via the public API without login).
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log || {
            grep -v '^\s*$' build.log | tail -n 10 | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/^/::error::/'
            exit 1
          }
          ls -lah fakeroot/System/Library/Kernels/
          file fakeroot/System/Library/Kernels/kernel.release.vmapple   # expect arm64, not arm64e

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xnu-arm64-vmapple
          path: build-xnu/fakeroot/System/Library/Kernels/
          if-no-files-found: error
